name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze und Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter-Version
        run: flutter --version

      - name: Abhängigkeiten
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.txt || {
            .github/scripts/annotate.sh error "flutter pub get" pub.txt
            exit 1
          }

      - name: Code generieren (Drift)
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.txt || {
            .github/scripts/annotate.sh error "build_runner" build_runner.txt
            exit 1
          }

      - name: Formatierung prüfen
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test > format.txt 2>&1 || {
            .github/scripts/annotate.sh warning "dart format (nicht formatierte Dateien)" format.txt
            exit 1
          }

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt || {
            .github/scripts/annotate.sh error "flutter analyze" analyze.txt
            exit 1
          }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt || {
            grep -n -B2 -A25 '\[E\]\|EXCEPTION CAUGHT\|Error:' test.txt > test_failures.txt || true
            .github/scripts/annotate.sh error "flutter test (Fehler)" test_failures.txt
            .github/scripts/annotate.sh error "flutter test (Ende der Ausgabe)" test.txt
            exit 1
          }

  sync-generated:
    name: Generierten Code einchecken
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Ordner anlegen, falls sie fehlen
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --org de.anhaengerverwaltung --project-name anhaenger_verwaltungssystem .
          fi
          if [ ! -d android ]; then
            flutter create --platforms=android --org de.anhaengerverwaltung --project-name anhaenger_verwaltungssystem .
            sed -i 's/android:label="anhaenger_verwaltungssystem"/android:label="Anhänger-Verwaltung"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Generieren und formatieren
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test

      - name: Committen, falls sich etwas geändert hat
        run: |
          git add -A lib test pubspec.lock linux android .metadata
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated code, formatting, lockfile and platform folders"
          git push

  macos:
    name: macOS-Build
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build_macos.txt || {
            .github/scripts/annotate.sh error "flutter build macos" build_macos.txt
            exit 1
          }

      - uses: actions/upload-artifact@v6
        with:
          name: anhaenger-verwaltung-macos
          path: build/macos/Build/Products/Release/
          retention-days: 14

  windows:
    name: Windows-Build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: flutter build windows --release

      - uses: actions/upload-artifact@v6
        with:
          name: anhaenger-verwaltung-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14

  linux:
    name: Linux-Build (AppImage)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file

      - name: Linux-Projektordner anlegen, falls er fehlt
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --org de.anhaengerverwaltung --project-name anhaenger_verwaltungssystem .
          fi

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee build_linux.txt || {
            .github/scripts/annotate.sh error "flutter build linux" build_linux.txt
            exit 1
          }

      - name: AppImage und Archiv erstellen
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$APPDIR/anhaenger-verwaltung.png"
          cat > "$APPDIR/anhaenger-verwaltung.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Anhänger-Verwaltung
          Comment=Offline-Verwaltung für eine Anhängervermietung
          Exec=anhaenger_verwaltungssystem
          Icon=anhaenger-verwaltung
          Categories=Office;
          Terminal=false
          DESKTOP
          sed -i 's/^ *//' "$APPDIR/anhaenger-verwaltung.desktop"
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/anhaenger_verwaltungssystem" "$@"
          APPRUN
          sed -i 's/^ *//' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$APPDIR" dist/Anhaenger-Verwaltung-x86_64.AppImage
          tar -czf dist/anhaenger-verwaltung-linux-x64.tar.gz -C "$BUNDLE" .

      - uses: actions/upload-artifact@v6
        with:
          name: anhaenger-verwaltung-linux
          path: dist/
          retention-days: 14

  android:
    name: Android-Build (APK)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projektordner anlegen, falls er fehlt
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org de.anhaengerverwaltung --project-name anhaenger_verwaltungssystem .
            sed -i 's/android:label="anhaenger_verwaltungssystem"/android:label="Anhänger-Verwaltung"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_android.txt || {
            .github/scripts/annotate.sh error "flutter build apk" build_android.txt
            exit 1
          }
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Anhaenger-Verwaltung.apk

      - uses: actions/upload-artifact@v6
        with:
          name: anhaenger-verwaltung-android
          path: dist/
          retention-days: 14
