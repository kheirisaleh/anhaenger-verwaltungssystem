name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze und Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter-Version
        run: flutter --version

      - name: Abhängigkeiten
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.txt || {
            .github/scripts/annotate.sh error "flutter pub get" pub.txt
            exit 1
          }

      - name: Code generieren (Drift)
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.txt || {
            .github/scripts/annotate.sh error "build_runner" build_runner.txt
            exit 1
          }

      - name: Formatierung prüfen
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test > format.txt 2>&1 || {
            .github/scripts/annotate.sh warning "dart format (nicht formatierte Dateien)" format.txt
            exit 1
          }

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt || {
            .github/scripts/annotate.sh error "flutter analyze" analyze.txt
            exit 1
          }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt || {
            grep -n -B2 -A25 '\[E\]\|EXCEPTION CAUGHT\|Error:' test.txt > test_failures.txt || true
            .github/scripts/annotate.sh error "flutter test (Fehler)" test_failures.txt
            .github/scripts/annotate.sh error "flutter test (Ende der Ausgabe)" test.txt
            exit 1
          }

  sync-generated:
    name: Generierten Code einchecken
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generieren und formatieren
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test

      - name: Committen, falls sich etwas geändert hat
        run: |
          git add -A lib test pubspec.lock
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated code, formatting and lockfile"
          git push

  macos:
    name: macOS-Build
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build_macos.txt || {
            .github/scripts/annotate.sh error "flutter build macos" build_macos.txt
            exit 1
          }

      - uses: actions/upload-artifact@v6
        with:
          name: anhaenger-verwaltung-macos
          path: build/macos/Build/Products/Release/
          retention-days: 14

  windows:
    name: Windows-Build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: flutter build windows --release

      - uses: actions/upload-artifact@v6
        with:
          name: anhaenger-verwaltung-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14
